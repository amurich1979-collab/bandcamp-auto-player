<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bandcamp Auto Player</title>
  <style>
    :root { color-scheme: light dark; }
    body { width: 300px; margin: 0; padding: 14px; font: 14px/1.4 system-ui, sans-serif; }
    h1, h2 { margin: 0 0 10px; } h1 { font-size: 16px; } h2 { font-size: 14px; margin-top: 18px; }
    #status { min-height: 40px; margin: 0 0 12px; color: #555; } #status.error { color: #b42318; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .settings { display: flex; gap: 8px; align-items: center; }
    button, input { box-sizing: border-box; padding: 8px; border: 1px solid #1687a7; border-radius: 6px; }
    button { margin-top: 8px; cursor: pointer; } button.primary { width: 100%; color: white; background: #1687a7; }
    button:disabled { cursor: wait; opacity: .55; } input { width: 60px; }
    #history { max-height: 200px; overflow: auto; padding-left: 18px; margin: 8px 0; font-size: 12px; }
    #history li { margin: 7px 0; } #history a { display: block; color: #1687a7; }
    .outcome { font-size: 11px; } .completed { color: #16803c; } .skipped { color: #b42318; }
  </style>
</head>
<body>
  <h1>Bandcamp Auto Player</h1>
  <p id="status" aria-live="polite">Checking page…</p>
  <button class="primary" data-action="start">Start</button>
  <button class="primary" data-action="stop">Stop auto-play</button>
  <div class="row"><button data-action="previous">← Previous</button><button data-action="next">Next →</button></div>
  <h2>Next release delay</h2>
  <div class="settings"><input id="delaySeconds" type="number" min="0" max="300" step="1"><span>seconds</span><button id="saveSettings">Save</button></div>
  <h2>Listening history</h2>
  <ul id="history"></ul>
  <button id="clearHistory">Clear history</button>
  <script src="popup.js"></script>
</body>
</html>
