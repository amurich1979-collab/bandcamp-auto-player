<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bandcamp Auto Player</title>
  <style>
    :root { color-scheme: light dark; }
    body { width: 200px; margin: 0; padding: 10px; font: 13px/1.35 system-ui, sans-serif; }
    h1, h2 { margin: 0 0 8px; } h1 { font-size: 15px; } h2 { font-size: 13px; margin-top: 12px; }
    #status { min-height: 34px; margin: 0 0 8px; color: #555; } #status.empty { display: none; } #status.error { color: #b42318; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button, input { box-sizing: border-box; padding: 7px; border: 1px solid #4c9ab8; border-radius: 5px; }
    button { margin-top: 6px; cursor: pointer; } button.primary { color: white; background: #4c9ab8; }
    button:hover { background: #397c96; color: white; }
    button:disabled { cursor: wait; opacity: .55; } input { width: 60px; }
    #historyPanel { display: none; }
    #historyPanel.open { display: block; }
    #historyList { max-height: 180px; overflow: auto; margin: 8px 0; padding-left: 18px; font-size: 12px; }
    #historyList li { margin: 7px 0; }
    #historyList a, #historyList small { display: block; }
    #historyList a { color: #4c9ab8; }
  </style>
</head>
<body>
  <h1>Bandcamp Auto Player</h1>
  <div class="row"><button class="primary" data-action="start">Start</button><button class="primary" data-action="stop">Stop</button></div>
  <div class="row"><button data-action="previous">← Previous</button><button data-action="next">Next →</button></div>
  <button id="toggleHistory">View history</button>
  <section id="historyPanel"><ul id="historyList"></ul></section>
  <script src="popup.js"></script>
</body>
</html>
